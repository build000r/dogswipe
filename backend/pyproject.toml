[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "dogswipe-backend"
version = "0.1.0"
description = "DogSwipe FastAPI backend using Sweet Potato/SPAPS quickstart contracts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.118.0,<0.119",
  "uvicorn[standard]>=0.37.0,<0.38",
  "sqlalchemy>=2.0.30,<3.0",
  "alembic>=1.13.0,<2.0",
  "asyncpg>=0.30.0,<0.31",
  "aiosqlite>=0.20.0,<1.0",
  "pydantic>=2.8.0,<3.0",
  "pydantic-settings>=2.3.0,<3.0",
  "httpx>=0.28.1,<0.29",
  "orjson>=3.10.0,<4.0",
  "stripe>=10.0.0,<12.0",
  "spaps>=0.5.0",
  "spaps-server-quickstart~=0.5.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0,<9.0",
  "pytest-asyncio>=0.23.0,<0.24",
  "pytest-cov>=5.0.0,<6.0",
  "ruff>=0.4.1,<0.5",
  "mypy>=1.10.0,<1.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dogswipe_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["dogswipe_backend"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
sort = "-Cover"

[tool.ruff]
src = ["src", "tests", "migrations"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"src/dogswipe_backend/api.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
ignore_missing_imports = true
