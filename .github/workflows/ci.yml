name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout quality skills
        run: git clone --depth 1 https://github.com/build000r/skills.git "$RUNNER_TEMP/quality-skills"
      - name: Install quality dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'backend[test]'
      - name: Test
        run: cd backend && pytest -q
      - name: Coverage
        run: cd backend && pytest --cov=dogswipe_backend --cov-report=term-missing --cov-report=xml -q
      - name: CRAP quality gate
        run: make crap SKILLS_ROOT="$RUNNER_TEMP/quality-skills"
      - name: MMDX preflight
        run: make mmdx-preflight SKILLS_ROOT="$RUNNER_TEMP/quality-skills"
      - name: SwiftUI drift gate
        run: make drift SKILLS_ROOT="$RUNNER_TEMP/quality-skills"
      - name: Lint
        run: cd backend && ruff check src tests migrations
      - name: Typecheck
        run: cd backend && mypy src
      - name: Migration smoke
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/dogswipe-ci-migrate.sqlite
        run: cd backend && alembic upgrade head && alembic current | grep '(head)'
      - name: Production compose config
        env:
          DOGSWIPE_IMAGE: dogswipe-api:ci
          DOGSWIPE_ENV_FILE: prod.env.example
          POSTGRES_PASSWORD: ci-postgres
        run: docker compose --env-file deploy/prod.env.example -f deploy/docker-compose.prod.yml config >/dev/null
      - name: Deploy preflight
        env:
          DOGSWIPE_IMAGE: dogswipe-api:ci
          DOGSWIPE_ENV_FILE: prod.env.example
          POSTGRES_PASSWORD: ci-postgres
        run: make deploy-preflight
      - name: Skillbox overlay template
        run: make deploy-overlay-template
      - name: Docker image build
        run: docker build -q backend

  swift-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests
        run: swift test --package-path packages/DogSwipeCore

  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: make generate-ios
      - name: Release asset manifest
        run: make ios-release-assets
      - name: Build app
        run: xcodebuild -quiet -project apps/ios/DogSwipe/DogSwipe.xcodeproj -scheme DogSwipe -destination 'generic/platform=iOS' build
      - name: Unit tests
        run: |
          set -euo pipefail
          selection="$(python3 <<'PY'
          import json
          import re
          import subprocess

          data = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "--json"],
                  text=True,
              )
          )
          devices = []
          for runtime, runtime_devices in data["devices"].items():
              for device in runtime_devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      devices.append((runtime, device))

          if not devices:
              raise SystemExit("No available iPhone simulators found")

          def runtime_version(runtime):
              match = re.search(r"iOS-(\d+(?:-\d+)*)$", runtime)
              if not match:
                  return ()
              return tuple(int(part) for part in match.group(1).split("-"))

          devices.sort(key=lambda item: runtime_version(item[0]), reverse=True)
          preferred_names = [
              "iPhone 17 Pro",
              "iPhone 17",
              "iPhone 16 Pro",
              "iPhone 16",
              "iPhone 16e",
              "iPhone 15 Pro",
              "iPhone 15",
              "iPhone 14 Pro",
              "iPhone 14",
          ]

          selected = None
          for name in preferred_names:
              selected = next((item for item in devices if item[1]["name"] == name), None)
              if selected:
                  break
          if selected is None:
              selected = next((item for item in devices if "SE" not in item[1]["name"]), devices[0])

          runtime, device = selected
          print(f"{device['udid']}|{device['name']}|{runtime}", end="")
          PY
          )"
          IFS='|' read -r simulator_id simulator_name simulator_runtime <<< "$selection"
          test -n "$simulator_id"
          echo "Selected iOS simulator: ${simulator_name} (${simulator_id}) on ${simulator_runtime}"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcodebuild \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60 \
            -project apps/ios/DogSwipe/DogSwipe.xcodeproj \
            -scheme DogSwipe \
            -destination "platform=iOS Simulator,id=${simulator_id},arch=arm64" \
            test
