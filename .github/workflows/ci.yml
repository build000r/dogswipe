name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout quality skills
        run: git clone --depth 1 https://github.com/build000r/skills.git "$RUNNER_TEMP/quality-skills"
      - name: Install quality dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'backend[test]'
      - name: Test
        run: cd backend && pytest -q
      - name: Coverage
        run: cd backend && pytest --cov=dogswipe_backend --cov-report=term-missing --cov-report=xml -q
      - name: CRAP quality gate
        run: make crap SKILLS_ROOT="$RUNNER_TEMP/quality-skills"
      - name: MMDX preflight
        run: make mmdx-preflight SKILLS_ROOT="$RUNNER_TEMP/quality-skills"
      - name: SPAPS app contract
        run: make spaps-app-contract
      - name: SwiftUI drift gate
        run: make drift SKILLS_ROOT="$RUNNER_TEMP/quality-skills"
      - name: Lint
        run: cd backend && ruff check src tests migrations
      - name: Typecheck
        run: cd backend && mypy src
      - name: Migration smoke
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/dogswipe-ci-migrate.sqlite
        run: cd backend && alembic upgrade head && alembic current | grep '(head)'
      - name: Production compose config
        env:
          DOGSWIPE_IMAGE: dogswipe-api:ci
          DOGSWIPE_ENV_FILE: prod.env.example
          POSTGRES_PASSWORD: ci-postgres
        run: docker compose --env-file deploy/prod.env.example -f deploy/docker-compose.prod.yml config >/dev/null
      - name: Deploy preflight
        env:
          DOGSWIPE_IMAGE: dogswipe-api:ci
          DOGSWIPE_ENV_FILE: prod.env.example
          POSTGRES_PASSWORD: ci-postgres
        run: make deploy-preflight
      - name: Render Apple app-site association
        run: make deploy-render-aasa AASA_APPLE_TEAM_ID=ABCDE12345
      - name: Skillbox overlay template
        run: make deploy-overlay-template
      - name: Private deploy handoff template
        run: make deploy-private-handoff-template
      - name: Host bootstrap template
        run: make deploy-host-bootstrap-template
      - name: DNS preflight template
        run: make deploy-dns-preflight-template
      - name: Live readiness template
        run: make deploy-live-readiness-template
      - name: Release readiness
        run: |
          make deploy-release-readiness \
            ALLOW_PLACEHOLDERS=true \
            IOS_RELEASE_DEVELOPMENT_TEAM=ABCDE12345 \
            DOGSWIPE_RELEASE_API_BASE_URL=https://dogswipe-api.example.com \
            DOGSWIPE_RELEASE_ASSOCIATED_DOMAIN=dogswipe-api.example.com \
            DOGSWIPE_RELEASE_SPAPS_PUBLISHABLE_KEY=spaps_pub_example
      - name: Detect backend image changes
        id: image-changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$before" "$GITHUB_SHA" -- backend .github/workflows/ci.yml; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Docker image build
        run: |
          docker build \
            -t dogswipe-api:ci \
            -t ghcr.io/build000r/dogswipe:${GITHUB_SHA} \
            -t ghcr.io/build000r/dogswipe:latest \
            backend
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.image-changes.outputs.publish == 'true'
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.image-changes.outputs.publish == 'true'
        run: |
          docker push ghcr.io/build000r/dogswipe:${GITHUB_SHA}
          docker push ghcr.io/build000r/dogswipe:latest

  swift-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests
        run: swift test --package-path packages/DogSwipeCore

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: make generate-ios
      - name: Release asset manifest
        run: make ios-release-assets
      - name: Build app
        run: xcodebuild -quiet -project apps/ios/DogSwipe/DogSwipe.xcodeproj -scheme DogSwipe -destination 'generic/platform=iOS' build
      - name: Unit tests
        timeout-minutes: 15
        run: |
          set -euo pipefail
          selection="$(python3 scripts/select_ios_simulator.py)"
          IFS='|' read -r simulator_id simulator_name simulator_runtime <<< "$selection"
          test -n "$simulator_id"
          echo "Selected iOS simulator: ${simulator_name} (${simulator_id}) on ${simulator_runtime}"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          destination="platform=iOS Simulator,id=${simulator_id}"
          if [ "$(uname -m)" = "arm64" ]; then
            destination="${destination},arch=arm64"
          fi
          xcodebuild \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60 \
            -project apps/ios/DogSwipe/DogSwipe.xcodeproj \
            -scheme DogSwipe \
            -destination "${destination}" \
            -only-testing:DogSwipeTests \
            test
      - name: Screenshot UI smoke
        run: make ios-ui-test
