name: DogSwipe
options:
  bundleIdPrefix: com.build000r
  deploymentTarget:
    iOS: "17.0"
packages:
  DogSwipeCore:
    path: ../../../packages/DogSwipeCore
targets:
  DogSwipe:
    type: application
    platform: iOS
    sources:
      - path: DogSwipe
    dependencies:
      - package: DogSwipeCore
    info:
      path: DogSwipe/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        NSLocationWhenInUseUsageDescription: DogSwipe uses your location to sort nearby hotdogs by distance.
        DOGSWIPE_API_BASE_URL: http://localhost:8000
        DOGSWIPE_SPAPS_API_BASE_URL: https://api.sweetpotato.dev
        DOGSWIPE_SPAPS_PUBLISHABLE_KEY: ""
        DOGSWIPE_SPAPS_ORIGIN: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.build000r.dogswipe
            CFBundleURLSchemes:
              - dogswipe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.build000r.dogswipe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
  DogSwipeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DogSwipeTests
    dependencies:
      - target: DogSwipe
      - package: DogSwipeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.build000r.dogswipe.tests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: YES
